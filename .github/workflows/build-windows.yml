name: Build Windows Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas==2.0.3
        pip install numpy==1.24.3
        pip install openpyxl==3.1.2
        pip install scipy==1.11.1
        pip install xlsxwriter==3.1.2
        pip install pyinstaller==5.13.0
    
    - name: Build with PyInstaller
      run: |
        pyinstaller build_windows.spec --clean --noconfirm
    
    - name: Create portable package
      run: |
        # 创建便携版目录
        mkdir portable
        
        # 复制exe和依赖
        xcopy "dist\氧烛分析系统\*" portable\ /E /I /Y
        
        # 复制数据文件
        xcopy data portable\data\ /E /I /Y
        xcopy modules portable\modules\ /E /I /Y
        
        # 复制Python脚本（作为备份）
        copy *.py portable\
        
        # 创建示例目录
        mkdir portable\reports_input\示例产品
        mkdir portable\reports_output
        
        # 创建说明文件
        echo 请将测试报告放入 reports_input 文件夹 > portable\reports_input\使用说明.txt
        echo 分析结果将保存在 reports_output 文件夹 > portable\reports_output\使用说明.txt
        
    - name: Create README for package
      run: |
        @'
        氧烛分析系统 Windows版
        ======================
        
        使用方法：
        1. 将测试报告放入 reports_input 文件夹（每个产品一个子文件夹）
        2. 双击运行 氧烛分析系统.exe
        3. 选择功能执行
        4. 结果保存在 reports_output 文件夹
        
        目录结构：
        - reports_input/    <- 放入测试报告
          - 2A143/         <- 产品文件夹示例
            - *.xlsx       <- Excel测试报告
        - reports_output/   <- 分析结果输出
        - data/            <- 配置数据（不要修改）
        - modules/         <- 程序模块（不要修改）
        
        注意事项：
        - 确保测试报告格式正确
        - 不要移动或删除data文件夹
        - 如遇问题，查看命令行输出的错误信息
        '@ | Out-File -FilePath portable\使用说明.txt -Encoding UTF8
    
    - name: Test executable
      run: |
        cd portable
        .\氧烛分析系统.exe --version
        cd ..
      continue-on-error: true
    
    - name: Compress package
      run: |
        Compress-Archive -Path portable\* -DestinationPath 氧烛分析系统-Windows.zip
    
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: 氧烛分析系统-Windows
        path: |
          氧烛分析系统-Windows.zip
          portable/
    
    - name: Upload separate exe
      uses: actions/upload-artifact@v4
      with:
        name: 氧烛分析系统-exe
        path: dist/氧烛分析系统/氧烛分析系统.exe
