name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      run: |
        Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.8.10/python-3.8.10-embed-amd64.zip" -OutFile "python.zip"
        Expand-Archive -Path "python.zip" -DestinationPath "AWK_Portable\python"
        Add-Content -Path "AWK_Portable\python\python38._pth" -Value "`nLib`nLib\site-packages`nimport site"
      shell: pwsh
    
    - name: Install packages
      run: |
        cd AWK_Portable
        Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
        .\python\python.exe get-pip.py
        .\python\python.exe -m pip install streamlit pandas numpy plotly openpyxl scipy scikit-learn pyDOE2 joblib
      shell: pwsh
    
    - name: Copy files
      run: |
        xcopy /E /I modules AWK_Portable\app\modules
        xcopy /E /I data AWK_Portable\app\data
        copy *.py AWK_Portable\app\
      shell: pwsh
    
    - name: Create launcher
      run: |
        @'
        @echo off
        cd /d "%~dp0"
        start http://localhost:8501
        python\python.exe -m streamlit run app\网页系统.py
        pause
        '@ | Out-File -FilePath "AWK_Portable\启动.bat" -Encoding ascii
      shell: pwsh
    
    - name: Create archive
      run: |
        Compress-Archive -Path AWK_Portable -DestinationPath AWK_Windows_Portable.zip
      shell: pwsh
    
    - uses: actions/upload-artifact@v4
      with:
        name: AWK-Windows
        path: AWK_Windows_Portable.zip
