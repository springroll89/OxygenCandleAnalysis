name: Build Windows Final

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'windows_app.py'
      - '.github/workflows/build-windows-final.yml'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install minimal dependencies
      run: |
        pip install pyinstaller
        pip install pandas openpyxl
    
    - name: Build single file EXE
      run: |
        pyinstaller --onefile --console --name "氧烛分析系统" windows_app.py
    
    - name: Test EXE
      run: |
        dist\氧烛分析系统.exe --version
      continue-on-error: true
    
    - name: Create package
      run: |
        mkdir package
        copy dist\氧烛分析系统.exe package\
        
        # 创建启动脚本
        echo @echo off > package\启动.bat
        echo 氧烛分析系统.exe >> package\启动.bat
        echo pause >> package\启动.bat
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 氧烛分析系统-Win
        path: package/
