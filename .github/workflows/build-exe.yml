name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE - 一键运行
      shell: cmd
      run: |
        pyinstaller --onefile --name "氧烛分析系统" --noconfirm --clean --add-data "data;data" --add-data "modules;modules" --hidden-import pandas --hidden-import numpy --hidden-import openpyxl --hidden-import scipy 一键运行全部.py
    
    - name: Build EXE - 简单分析
      shell: cmd
      run: |
        pyinstaller --onefile --name "氧烛数据提取" --noconfirm --clean --add-data "data;data" --add-data "modules;modules" --hidden-import pandas --hidden-import numpy --hidden-import openpyxl 简单分析程序.py
    
    - name: Create Release Package
      shell: cmd
      run: |
        mkdir release
        copy dist\*.exe release\
        copy README.md release\
        xcopy data release\data\ /E /I /Y
        mkdir release\reports_input
        mkdir release\reports_output
        echo. > release\reports_input\readme.txt
        echo. > release\reports_output\readme.txt
    
    - name: Create Batch File
      run: |
        @'
        @echo off
        echo ========================================
        echo    氧烛产品分析系统
        echo ========================================
        echo.
        echo 请将测试报告放入 reports_input 文件夹
        echo.
        pause
        氧烛分析系统.exe
        pause
        '@ | Out-File -FilePath release\运行分析.bat -Encoding ASCII
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OxygenCandleAnalysis-Windows
        path: release/
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
