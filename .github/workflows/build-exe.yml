name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE - 一键运行
      run: |
        pyinstaller --onefile --name "氧烛分析系统" --icon=icon.ico --noconfirm --clean ^
          --add-data "data;data" ^
          --add-data "modules;modules" ^
          --hidden-import pandas ^
          --hidden-import numpy ^
          --hidden-import openpyxl ^
          --hidden-import scipy ^
          一键运行全部.py
    
    - name: Build EXE - Web界面
      run: |
        pyinstaller --onefile --name "氧烛分析Web界面" --icon=icon.ico --noconfirm --clean ^
          --add-data "data;data" ^
          --add-data "modules;modules" ^
          --hidden-import streamlit ^
          --hidden-import plotly ^
          --collect-all streamlit ^
          网页系统.py
    
    - name: Create Release Package
      run: |
        mkdir release
        copy dist\*.exe release\
        copy run_windows.bat release\
        copy README.md release\
        xcopy data release\data\ /E /I
        mkdir release\reports_input
        mkdir release\reports_output
        echo. > release\reports_input\.gitkeep
        echo. > release\reports_output\.gitkeep
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: OxygenCandleAnalysis-Windows
        path: release/
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.exe
          release.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
