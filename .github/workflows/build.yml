name: Build Windows Release

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:           # 只在创建tag时自动触发
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy openpyxl pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --console --name "氧烛分析系统" standalone_main.py
    
    - name: Prepare release
      run: |
        mkdir release
        copy dist\*.exe release\
        xcopy data release\data\ /E /I /Y
        mkdir release\reports_input
        mkdir release\reports_output
    
    - name: Create batch file
      run: |
        echo @echo off > release\运行.bat
        echo chcp 65001 >> release\运行.bat
        echo echo 氧烛产品分析系统 >> release\运行.bat
        echo echo. >> release\运行.bat
        echo 氧烛分析系统.exe >> release\运行.bat
        echo pause >> release\运行.bat
    
    - name: Upload Release
      uses: actions/upload-artifact@v4
      with:
        name: OxygenCandleAnalysis-Windows
        path: release/
